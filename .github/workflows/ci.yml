name: ci
on:
  push:
  workflow_dispatch:
    inputs:
      big:
        description: "events for the timing run (0 = skip)"
        default: "20000000"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU
        run: |
          nproc; free -g; lscpu | grep -E 'Model name|Flags' | cut -c1-600; grep -m1 'model name' /proc/cpuinfo
          grep -m1 -o 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - name: Build
        run: |
          cargo build --release --manifest-path engine/Cargo.toml
          cargo build --release --manifest-path oracle/Cargo.toml
          cargo build --release --manifest-path tools/generator/Cargo.toml
          pip install -q polars pyarrow
      - name: Engine tests
        run: cargo test --release --manifest-path engine/Cargo.toml
      - name: Fixtures (engine, oracle)
        run: |
          python3 scripts/run_fixtures.py fixtures -- engine/target/release/engine | tail -1
          python3 scripts/run_fixtures.py fixtures -- oracle/target/release/oracle | tail -1
          python3 scripts/run_fixtures.py fixtures -- engine/target/release/engine > /dev/null
      - name: Dev answer
        run: |
          G=tools/generator/target/release/generate
          $G --seed 1 --events 1000000 --clicks 250000 --output /tmp/dev
          engine/target/release/engine /tmp/dev /tmp/dev_out
          cd scripts && python3 compare.py /tmp/dev_out ../tests/dev-answer
      - name: Seed sweep vs oracle
        run: |
          G=tools/generator/target/release/generate
          for s in $(seq 100 130); do
            e=$(( 50000 + (s * 7919) % 400000 )); c=$(( e * (s % 9) / 6 + 1000 ))
            $G --seed $s --events $e --clicks $c --output /tmp/sw >/dev/null
            rm -rf /tmp/a /tmp/b
            engine/target/release/engine /tmp/sw /tmp/a
            oracle/target/release/oracle /tmp/sw /tmp/b
            r=$(cd scripts && python3 compare.py /tmp/a /tmp/b | tail -1)
            echo "seed $s e=$e c=$c $r"; [ "$r" = MATCH ] || exit 1
            rm -rf /tmp/sw
          done
      - name: Docker image fixtures
        run: |
          docker build -q -t shopping-sessions:latest .
          export CPUS=$(nproc) MEM=12g
          python3 scripts/run_fixtures.py fixtures -- scripts/docker_run.sh 2>&1 | tail -15
      - name: Timing run vs oracle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.big != '0' }}
        run: |
          G=tools/generator/target/release/generate
          E=${{ inputs.big }}
          $G --seed 77 --events $E --clicks $((E/4)) --output /tmp/big
          du -sh /tmp/big
          for i in 1 2 3; do rm -rf /tmp/big_out; /usr/bin/time -v env ENGINE_TIMING=1 engine/target/release/engine /tmp/big /tmp/big_out 2>&1 | grep -E 's |Elapsed|Maximum resident'; done
          rm -rf /tmp/big_out; time CPUS=$(nproc) MEM=12g scripts/docker_run.sh /tmp/big /tmp/big_out_docker
          oracle/target/release/oracle /tmp/big /tmp/big_ref
          cd scripts && python3 compare.py /tmp/big_out_docker /tmp/big_ref
      - name: Scaling and perf profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.big != '0' }}
        run: |
          for n in 1 2 4; do echo "NCPU=$n"; rm -rf /tmp/big_out; NCPU=$n ENGINE_TIMING=1 engine/target/release/engine /tmp/big /tmp/big_out 2>&1 | tr '\n' ' '; echo; done
          lscpu | grep -E 'Thread|Core|Socket|L2|L3|MHz' | tr -s ' ' | tr '\n' ';'; echo
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          sudo apt-get update -q >/dev/null 2>&1 || true
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -q linux-tools-generic >/dev/null 2>&1 || true
          cd engine && CARGO_PROFILE_RELEASE_DEBUG=1 cargo build --release --target-dir /tmp/tgt_dbg 2>&1 | tail -1; cd ..
          rm -rf /tmp/big_out
          P=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); echo "perf=$P"
          sudo sysctl kernel.perf_event_paranoid=-1 >/dev/null 2>&1 || true
          if [ -n "$P" ]; then
            sudo $P record -e cpu-clock -F 2000 -o /tmp/perf.data /tmp/tgt_dbg/release/engine /tmp/big /tmp/big_out 2>&1 | tail -2 || true
            sudo $P report -i /tmp/perf.data --stdio --no-children 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30 | cut -c1-150 || true
          else
            sudo apt-get install -y -q valgrind >/dev/null 2>&1 || true
            /tmp/tgt_dbg/release/engine --help >/dev/null 2>&1 || true
            tools/generator/target/release/generate --seed 5 --events 1500000 --clicks 375000 --output /tmp/small >/dev/null
            NCPU=1 valgrind --tool=callgrind --callgrind-out-file=/tmp/cg.out /tmp/tgt_dbg/release/engine /tmp/small /tmp/small_out 2>&1 | tail -2
            callgrind_annotate /tmp/cg.out 2>/dev/null | grep -E '^ *[0-9,]{9,} [(]' | head -30 | cut -c1-200
          fi
