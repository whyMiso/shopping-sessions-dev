[package]
name = "oracle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow"] }
serde_json = "1"
rustc-hash = "2"

[profile.release]
opt-level = 3
debug = false
